plugins {
    id 'com.android.application'
}

android {
    namespace 'org.openpack.app'
    compileSdk 34

    defaultConfig {
        applicationId 'org.openpack.app'
        minSdk 19            // Android 4.4 (2013)
        targetSdk 34
        versionCode 3
        versionName '0.3.0-test'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // A release build is signed with YOUR keystore, described in android/keystore.properties
    // (see keystore.properties.example). That file and the keystore are never committed.
    def keystoreFile = rootProject.file('keystore.properties')
    def keystore = new Properties()
    if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
                // Old phones (before Android 7) only understand the first signing scheme; new ones need the later ones.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true   // the screen test reads the built-in pack from assets
    }
    testOptions.unitTests.all {
        // Where the simulated Android used by the screen test is fetched from, once.
        systemProperty 'robolectric.dependency.repo.url', 'https://maven-central.storage-download.googleapis.com/maven2'
    }
    lint {
        // The build stops if code calls something an old phone does not have.
        abortOnError true
        checkReleaseBuilds false
        fatal 'NewApi', 'InlinedApi'
        disable 'OldTargetApi', 'GradleDependency', 'UnusedAttribute', 'SetJavaScriptEnabled', 'HardcodedText',
                'AllowBackup', 'DataExtractionRules', 'ObsoleteSdkInt', 'MissingTranslation', 'IconLocation',
                'UnspecifiedRegisterReceiverFlag', 'ButtonStyle', 'RtlHardcoded', 'UnusedResources', 'VectorRaster',
                'ForegroundServiceType', 'WakelockTimeout', 'Wakelock', 'DefaultLocale',
                'DiscouragedApi', 'InsecureBaseConfiguration', 'UnsafeIntentLaunch', 'IconMissingDensityFolder',
                'AndroidGradlePluginVersion', 'NewerVersionAvailable', 'ExpiredTargetSdkVersion', 'SelectedPhotoAccess',
                'UseRequiresApi', 'StaticFieldLeak', 'UsableSpace', 'MonochromeLauncherIcon', 'PluralsCandidate', 'Overdraw'
    }
    // The portal ships .js lesson files and fonts as assets: store them as they are.
    androidResources { noCompress += ['woff', 'woff2'] }
}

dependencies {
    // Pure-Java Ed25519 (CC0). Android only gained built-in Ed25519 in version 13.
    implementation 'net.i2p.crypto:eddsa:0.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // Runs the real screen code on a computer, without a phone.
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
