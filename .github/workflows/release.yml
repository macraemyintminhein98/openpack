name: Release
# Publishes the server programs for every platform plus a ready-to-open demo bundle.
#
# It runs by itself when the version number in package.json changes on main: bump the
# version, push, and the release named v<version> appears. If that release already exists,
# the run stops early and changes nothing. It can also be started by pushing a tag, or by
# hand from the Actions tab.
#
# Real packs are NOT built here: your signing key must never be put on GitHub. Build and sign
# packs on your own machine (scripts/weekly-release.sh). The demo bundle is signed with a
# throwaway key made during the run and discarded.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, for example v0.4.0 (empty = version in package.json)'
        required: false
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out which version this is
        id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then TAG="$INPUT_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then TAG="$REF_NAME"
          else TAG="v$(node -p 'require("./package.json").version')"; fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $TAG"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # An automatic run never touches a release that already exists.
          if [[ -z "$INPUT_TAG" && "$REF_TYPE" != "tag" ]] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip != 'true'
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        if: steps.v.outputs.skip != 'true'
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - run: npm test
        if: steps.v.outputs.skip != 'true'
      - run: bash scripts/build-server.sh
        if: steps.v.outputs.skip != 'true'
      - name: Build the demo bundle (throwaway key)
        if: steps.v.outputs.skip != 'true'
        run: |
          node bin/openpack.js keygen "$RUNNER_TEMP/demo-keys"
          node bin/openpack.js build packs/example --key "$RUNNER_TEMP/demo-keys/openpack.key" --version demo
          bash scripts/make-bundle.sh dist/example-demo "$RUNNER_TEMP/demo-keys/openpack.pub"
          rm -rf "$RUNNER_TEMP/demo-keys"
          mkdir -p out
          cp dist/OpenPack-example-demo.zip out/OpenPack-demo-bundle.zip
          cp dist-bin/* out/
          cd out && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        if: steps.v.outputs.skip != 'true'
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "OpenPack $TAG" --generate-notes
          fi
