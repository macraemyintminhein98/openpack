name: Release
# Publishes the server programs for every platform plus a ready-to-open demo bundle.
# Start it either by pushing a version tag (git tag v0.4.0 && git push origin v0.4.0) or from
# the Actions tab: Release > Run workflow > type the version tag.
#
# Real packs are NOT built here: your signing key must never be put on GitHub. Build and sign
# packs on your own machine (scripts/weekly-release.sh). The demo bundle is signed with a
# throwaway key made during the run and discarded.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, for example v0.4.0'
        required: true
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: Check the tag looks like a version
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $TAG"; exit 1; }'
      - run: npm test
      - run: bash scripts/build-server.sh
      - name: Build the demo bundle (throwaway key)
        run: |
          node bin/openpack.js keygen "$RUNNER_TEMP/demo-keys"
          node bin/openpack.js build packs/example --key "$RUNNER_TEMP/demo-keys/openpack.key" --version demo
          bash scripts/make-bundle.sh dist/example-demo "$RUNNER_TEMP/demo-keys/openpack.pub"
          rm -rf "$RUNNER_TEMP/demo-keys"
          mkdir -p out
          cp dist/OpenPack-example-demo.zip out/OpenPack-demo-bundle.zip
          cp dist-bin/* out/
          cd out && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "OpenPack $TAG" --generate-notes
          fi
