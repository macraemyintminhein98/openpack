name: Release
# Runs only when a version tag is pushed (git tag v0.4.0 && git push origin v0.4.0).
# Publishes the server programs for every platform. Packs are NOT built here: the signing
# key must never be put on GitHub. Build and sign packs on your own machine
# (scripts/weekly-release.sh).
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - run: npm test
      - run: bash scripts/build-server.sh
      - run: cd dist-bin && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-bin/* --title "$GITHUB_REF_NAME" --generate-notes
