name: CI
# One run per change: pushes to main, and pull requests. Docs-only changes do not start a run.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: Unit tests (Node + Go)
        run: npm test
      - name: Go vet
        run: cd server && go vet ./...
      - name: Lint shell scripts
        run: shellcheck -S warning scripts/*.sh box/*.sh bundle/*.sh
      - name: End-to-end (build, sign, verify, tamper checks, serve)
        run: bash scripts/e2e.sh
